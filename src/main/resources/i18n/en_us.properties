# ---------- Help ----------
help.title=MCArgus v{0} — Smart Minecraft server launcher
help.usage=Usage: java -jar mcargus.jar [options] [-- args passed through to the server]
help.usageAlt=\ \ \ \ \ You can also rename this jar to server.jar and place it in the server root (compatible with the default Pterodactyl egg).
help.capabilities=Features:
help.cap1=\ \ 1. Automatically discovers Forge/NeoForge unix_args.txt / win_args.txt and picks the one for the current OS;
help.cap1cont=\ \ \ \ \ results are cached and re-scanned when paths break, files change, or versions update;
help.cap1cont2=\ \ \ \ \ falls back to launching a Fabric/Quilt/vanilla executable jar when no args file is found.
help.cap2=\ \ 2. The server is always launched with the system's native Java; MCArgus does not replace or interfere with the host's
help.cap2cont=\ \ \ \ \ dynamic linker or libc. If a mod's native library requires a newer GLIBC than the host, upgrade
help.cap2cont2=\ \ \ \ \ the OS / switch to a distro that meets the requirement (the launch log will hint at this).
help.cap3=\ \ 3. Before launch, automatically cleans download-site prefix decorations from mods/ filenames, e.g.
help.cap3cont=\ \ \ \ \ "[JEI背包管理器[Forge]]jei.jar" → "jei.jar" (skips with a warning on name clashes to avoid duplicate mods).
help.options=Options:
help.opt.dir=\ \ --dir <dir>\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Server root (default: current directory; /home/container under Pterodactyl)
help.opt.java=\ \ --java <path>\ \ \ \ \ \ \ \ \ \ \ \ Java used for the server (executable or JAVA_HOME dir; default: auto)
help.opt.argsFile=\ \ --args-file <file>\ \ \ \ \ \ \ Manually specify the args file (skips auto-discovery)
help.opt.jvm=\ \ --jvm "<args>"\ \ \ \ \ \ \ \ \ \ \ \ \ Extra JVM args (space-separated), overrides config jvm.extraArgs
help.opt.programArgs=\ \ --program-args "<args>" Server program args (default nogui; pass an empty string to clear)
help.opt.rescan=\ \ --rescan\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Ignore cache and scan state; force a full re-scan
help.opt.sanitize=\ \ --sanitize\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Fully scan and fix mods filenames, then exit (no launch)
help.opt.noSanitize=\ \ --no-sanitize\ \ \ \ \ \ \ \ \ \ \ \ \ Skip mods scan and cleanup this time
help.opt.dryRun=\ \ --dry-run\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Print the full command without launching
help.opt.doctor=\ \ --doctor\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Output an environment diagnostics report (best first step for troubleshooting)
help.opt.config=\ \ --config <file>\ \ \ \ \ \ \ \ \ \ \ Specify the config file path (default <server dir>/mcargus/mcargus.properties)
help.opt.versionHelp=\ \ --version, --help
help.exitCodes=Exit codes: 0=OK  2=usage error  3=preflight check failed  other=server's own exit code
help.logs=Logs: console + <server dir>/mcargus/logs/mcargus.log (daily rotation, kept 14 days)

# ---------- Config file ----------
config.corruptRecovered=Config file is corrupt ({0}); restored defaults. A full scan will run this time.
config.corruptBackedUp=The corrupt config was backed up to: {0}
config.corruptBackupFailed=Failed to back up the corrupt config (it will be overwritten on the next save): {0}
config.saveFailed=Failed to save config (continuing, but cache will not persist): {0}
config.header=MCArgus configuration (user settings + launch-target cache)\nlocale: UI language, zh_cn (default, Simplified Chinese) / en_us (English); takes effect on next launch\njava.path: server Java path (executable or JAVA_HOME dir); empty=auto (current JVM > JAVA_HOME > PATH)\njvm.extraArgs: extra JVM args (space-separated)\njvm.forwardParentArgs: forward memory/GC args (-Xmx etc.) received when launching MCArgus to the server\njvm.useUserJvmArgs: whether to read user_jvm_args.txt in the server directory (Forge/NeoForge standard)\nprogram.args: program args passed to the server (default nogui)\nglibc.*: deprecated (the standalone glibc runtime feature was removed). MCArgus always launches with the system's native Java and never replaces system libraries; if a mod requires a newer GLIBC than the host, upgrade the OS.\nmods.sanitize: auto-clean [xx]/【xx】 style prefix decorations in mods/ filenames before launch (default true)\nysm.compat: enable the GLIBC_2.18 compat layer for YSM when glibc < 2.18 and YSM is in mods/ (server process only, system libraries untouched; default true)\nscan.scanCompleted: whether the last full mods scan completed (auto-maintained; false/missing = full scan next launch)\nscan.modsFingerprint: fingerprint of top-level .jar "name+size" in mods (auto-maintained; change triggers a full re-scan)\ninstall.enabled: auto-extract and install from a server archive (zip/tar.gz/tar) when no launch target exists (default true)\ninstall.completed/install.note: record and note of the installed archive (auto-maintained; delete to force re-extraction)\ninstall.zipEncoding: encoding for non-UTF-8 entry names in zip (default GBK, for Chinese packaging tools; ignore for pure-ASCII archives)\ncache.*: launch-target cache (auto-maintained; do not edit by hand — delete this file to force a full re-scan)

