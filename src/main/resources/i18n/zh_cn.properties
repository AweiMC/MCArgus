# MCArgus 界面语言包（简体中文，zh_cn）——默认语言
# 格式：key=value，value 支持 {0} {1} 占位符；行首空白会被 Properties 裁掉，故以 \ 转义。
# 注意：本文件必须以 UTF-8 编码保存。

# ---------- 命令行 ----------
cli.unknownArg=未知参数: {0}（使用 --help 查看用法）
cli.conflictSanitize=--sanitize 与 --no-sanitize 不能同时使用
cli.needValue={0} 需要一个值

# ---------- 主流程 ----------
main.unexpectedError=发生未预期的错误
main.serverDirMissing=服务器目录不存在: {0}
main.configRecovered=配置已恢复默认：清除启动目标缓存与扫描状态，本次将执行完整扫描。
main.configCreated=已生成默认配置文件: {0}
main.banner=MCArgus v{0} | 服务器目录: {1}
main.skipSanitizeFlag=已按 --no-sanitize 跳过 mods 扫描与清理。
main.sanitizeDisabled=mods.sanitize=false，跳过 mods 扫描与清理。
main.tryInstall=未找到启动目标，尝试从服务端压缩包自动安装（install.enabled=false 可关闭）...
main.forwardedArgs=从启动命令转发 {0} 个 JVM 参数（内存/GC 等）: {1}
main.target=启动目标: {0}
main.dryRunCmd=[dry-run] 将执行: {0}
main.dryRunDir=[dry-run] 工作目录: {0}
main.dryRunDone=[dry-run] 未实际启动。

# ---------- 帮助 ----------
help.title=MCArgus v{0} — Minecraft 服务端智能启动器
help.usage=用法: java -jar mcargus.jar [选项] [-- 透传给服务端的参数]
help.usageAlt=\ \ \ \ \ 也可直接把本 Jar 命名为 server.jar 放入服务器根目录（Pterodactyl 默认 egg 兼容）。
help.capabilities=能力:
help.cap1=\ \ 1. 自动发现 Forge/NeoForge 的 unix_args.txt / win_args.txt 并按当前系统选择，
help.cap1cont=\ \ \ \ \ 结果缓存、路径失效/文件变化/版本更新时自动重扫；
help.cap1cont2=\ \ \ \ \ 找不到参数文件时退化为 Fabric/Quilt/vanilla 可执行 Jar 启动。
help.cap2=\ \ 2. 服务端始终通过系统原生 Java 启动；MCArgus 不替换或干预宿主机的
help.cap2cont=\ \ \ \ \ 动态链接器与 libc。若模组原生库要求的 GLIBC 版本高于宿主，请升级
help.cap2cont2=\ \ \ \ \ 操作系统/更换满足要求的发行版（启动日志会给出相应提示）。
help.cap3=\ \ 3. 启动前自动清理 mods/ 目录文件名的下载站前缀装饰，如
help.cap3cont=\ \ \ \ \ \"[JEI背包管理器[Forge]]jei.jar\" → \"jei.jar\"（重名时跳过并警告，防止重复模组）。
help.options=选项:
help.opt.dir=\ \ --dir <目录>\ \ \ \ \ \ \ \ \ \ \ \ \ 服务器根目录（默认: 当前目录；Pterodactyl 下即 /home/container）
help.opt.java=\ \ --java <路径>\ \ \ \ \ \ \ \ \ \ \ 服务端使用的 Java（可执行文件或 JAVA_HOME 目录；默认自动）
help.opt.argsFile=\ \ --args-file <文件>\ \ \ \ \ \ 手动指定参数文件（跳过自动发现）
help.opt.jvm=\ \ --jvm \"<参数>\"\ \ \ \ \ \ \ \ \ \ \ \ 追加 JVM 参数（空格分隔），优先于配置 jvm.extraArgs
help.opt.programArgs=\ \ --program-args \"<参数>\" 服务端程序参数（默认 nogui；传空字符串可清空）
help.opt.rescan=\ \ --rescan\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 忽略缓存与扫描状态，强制完整重扫
help.opt.sanitize=\ \ --sanitize\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 完整扫描并修复 mods 目录文件名，然后退出（不启动）
help.opt.noSanitize=\ \ --no-sanitize\ \ \ \ \ \ \ \ \ \ \ 本次跳过 mods 扫描与清理
help.opt.dryRun=\ \ --dry-run\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 只打印将执行的完整命令，不启动
help.opt.doctor=\ \ --doctor\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 输出环境诊断报告（排障首选）
help.opt.config=\ \ --config <文件>\ \ \ \ \ \ \ \ \ \ 指定配置文件路径（默认 <服务器目录>/mcargus/mcargus.properties）
help.opt.versionHelp=\ \ --version, --help
help.exitCodes=退出码: 0=正常  2=用法错误  3=前置检查失败  其余=服务端自身退出码
help.logs=日志: 控制台 + <服务器目录>/mcargus/logs/mcargus.log（按天滚动，保留 14 天）

# ---------- 配置文件 ----------
config.corruptRecovered=配置文件损坏（{0}），已恢复默认配置，本次将执行完整扫描。
config.corruptBackedUp=损坏的配置已备份为: {0}
config.corruptBackupFailed=损坏配置备份失败（将在下次保存时直接覆盖）: {0}
config.saveFailed=配置保存失败（将继续运行，但缓存不会持久化）: {0}
config.header=MCArgus 配置（用户设置 + 启动目标缓存）\nlocale: 界面语言，zh_cn（默认，简体中文）/ en_us（English），改完下次启动生效\njava.path: 服务端 Java 路径（可执行文件或 JAVA_HOME 目录），留空=自动（当前JVM > JAVA_HOME > PATH）\njvm.extraArgs: 额外 JVM 参数（空格分隔）\njvm.forwardParentArgs: 把启动 MCArgus 时收到的内存/GC 参数（-Xmx 等）转发给服务端\njvm.useUserJvmArgs: 是否读取服务器目录的 user_jvm_args.txt（Forge/NeoForge 标准做法）\nprogram.args: 传给服务端的程序参数（默认 nogui）\nglibc.*: 已废弃（独立 glibc 运行时功能已移除）。MCArgus 始终用系统原生 Java 启动，不替换系统运行库；模组要求的 GLIBC 高于宿主时请升级操作系统。\nmods.sanitize: 启动前自动清理 mods/ 目录文件名的 [xx]/【xx】 等前缀装饰（默认 true）\nysm.compat: glibc < 2.18 且 mods/ 内有 YSM 时自动启用 GLIBC_2.18 兼容层（仅作用于服务端进程，不改系统库；默认 true）\nscan.scanCompleted: 上次 mods 完整扫描是否成功完成（自动维护；false/缺失=下次启动完整扫描）\nscan.modsFingerprint: mods 顶层 .jar 的\"文件名+大小\"指纹（自动维护；变化即触发完整重扫）\ninstall.enabled: 目录内没有启动目标时，是否自动从服务端压缩包(zip/tar.gz/tar)解压安装（默认 true）\ninstall.completed/install.note: 已安装压缩包的记录与备注（自动维护；删除后可强制重新解压）\ninstall.zipEncoding: zip 中非 UTF-8 条目名的解码编码（默认 GBK，适配中文打包软件；纯英文包可忽略）\ncache.*: 启动目标缓存（自动维护，请勿手改；删除本文件即可强制全量重扫）

