plugins {
    id 'java'
    id 'application'
}

group = 'com.mcargus'
version = '1.3.0'

repositories {
    mavenCentral()
}

dependencies {
    // 统一日志门面 + Logback 后端（1.2.x 兼容 Java 8 运行时）
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.6.6'
    // tar/tar.gz 压缩包支持（zip 用 JDK 内置）
    implementation 'org.apache.commons:commons-compress:1.28.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
    // 保持构建输出干净：废弃 API / 未检查类型在编译期直接暴露
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

application {
    mainClass = 'com.mcargus.Main'
}

// 打成可直接独立运行的 fat jar（内含 slf4j/logback 与 logback.xml），
// 面板/服务器只需上传这一个文件。
jar {
    manifest {
        attributes(
                'Main-Class': 'com.mcargus.Main',
                'Implementation-Title': 'MCArgus',
                'Implementation-Version': project.version
        )
    }
    archiveFileName = 'mcargus.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
            'module-info.class', 'META-INF/versions/**/module-info.class'
}

// 产物：build/dist/mcargus.jar 与 build/dist/server.jar
// 后者可直接上传到 Pterodactyl 作为 server.jar 使用（默认 egg 的 java -jar server.jar 即可启动）。
tasks.register('packageDist', Copy) {
    dependsOn jar
    from(layout.buildDirectory.file('libs/mcargus.jar'))
    into(layout.buildDirectory.dir('dist'))
    rename { 'mcargus.jar' }
}

tasks.register('packageDistServer', Copy) {
    dependsOn jar
    from(layout.buildDirectory.file('libs/mcargus.jar'))
    into(layout.buildDirectory.dir('dist'))
    rename { 'server.jar' }
}

tasks.register('packageAll') {
    dependsOn 'packageDist', 'packageDistServer'
}
